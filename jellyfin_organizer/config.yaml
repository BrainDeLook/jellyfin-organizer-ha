name: Jellyfin Organizer
version: "0.1.0"
slug: jellyfin_organizer
description: "Подготовка фильмов, сериалов, озвучек и субтитров для Jellyfin"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:movie-open
panel_admin: true
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
options:
  input_folders: []
  movies_folder: "/media/Movies"
  shows_folder: "/media/Shows"
  scan_interval_seconds: 60
  stable_seconds: 90
  auto_import: false
  embed_tracks: true
  preferred_audio: "AniDUB"
  keep_original_audio_default: false
  tokenclub_base_url: "https://api.tokenclub.cc/v1"
  tokenclub_model: ""
  tokenclub_api_key: ""
schema:
  input_folders:
    - str
  movies_folder: str
  shows_folder: str
  scan_interval_seconds: "int(10,86400)"
  stable_seconds: "int(30,86400)"
  auto_import: bool
  embed_tracks: bool
  preferred_audio: str
  keep_original_audio_default: bool
  tokenclub_base_url: url
  tokenclub_model: str
  tokenclub_api_key: password
